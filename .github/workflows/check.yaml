name: Check
run-name: Check and lint code

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master

jobs:
  check-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf libwebkit2gtk-4.1-dev

      - name: Run clippy lint
        run: |
          cd src-tauri
          cargo clippy --all-targets -- -D warnings

  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Compile locales
        run: pnpm locale:compile

      - name: Install test browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dialog regressions
        run: pnpm test

      - name: Run Prettier lint
        run: pnpm lint

      - name: Run Svelte check
        run: pnpm check

  test-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run worker and desktop regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml --features worker --lib
